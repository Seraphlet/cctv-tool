<!DOCTYPE html>
<html lang="zh-CN" data-release="20261024-cache-v1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>央视舆情模块化生成器</title>
    <!-- 每次访问以部署后的最新文件为准；保留 localStorage / IndexedDB 用户数据 -->
    <script>
    (function () {
        'use strict';
        const version = String(Date.now());
        const style = document.createElement('link');
        style.rel = 'stylesheet';
        style.href = 'style.css?v=' + version;
        document.head.appendChild(style);
        const core = document.createElement('script');
        core.src = 'core.js?v=' + version;
        core.defer = true;
        document.head.appendChild(core);

        // 老标签页在恢复使用时检测新版 HTML，避免持续运行旧代码。
        // 只有远端版本变更才刷新；网络失败不影响离线期间继续使用。
        const pageSignature = document.documentElement.getAttribute('data-release') || '';
        let checking = false;
        async function checkUpdate() {
            if (checking) return;
            checking = true;
            try {
                const res = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) return;
                const html = await res.text();
                const match = html.match(/<html[^>]*data-release="([^"]+)"/i);
                if (match && match[1] !== pageSignature) {
                    location.replace(location.pathname + '?v=' + encodeURIComponent(match[1]));
                }
            } catch (e) {
                console.debug('版本检查暂不可用', e);
            } finally {
                checking = false;
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkUpdate();
        });
        window.addEventListener('focus', checkUpdate);
        setInterval(() => { if (!document.hidden) checkUpdate(); }, 5 * 60 * 1000);
    })();
    </script>
</head>
<body>
<div class="container">
    <div class="title">央视舆情模块化生成器</div>

    <div class="calc-panel" id="calcPanel">
        <div class="calc-card" id="sumModule"></div>
        <div class="calc-card" id="segmentModule"></div>
        <div class="calc-card" id="diffModule"></div>
    </div>

    <div class="tab-main" id="mainTabs">
        <span data-m="richang" class="active">日常</span>
        <span data-m="quantao">全套监测</span>
        <span data-m="pingjie">📝 内容拼接</span>
        <span data-m="reader">📖 文本阅读</span>
    </div>

    <div class="tab-sub" id="yuqingTab">
        <span class="active" data-s="yuqing">舆情</span>
        <span data-s="zhengmian">正面</span>
    </div>

    <div class="tool-bar" id="toolBar">
        <button class="btn btn-warning normal-tool" id="editBtn">🔧 开启编辑模式</button>
        <button class="btn btn-dark normal-tool" id="saveDefaultBtn">💾 设为默认配置</button>
        <button class="btn btn-danger normal-tool" id="resetBtn">🔄 恢复初始配置</button>
        <button class="btn btn-dark" id="clearAllBtn" style="background:#8c8c8c;">🧹 清空所有内容</button>
    </div>

    <div id="moduleContainer">
        <p style="text-align:center;padding:40px;color:#999;">正在加载...</p>
    </div>

    <div class="copy-btn-group" id="copyBtns">
        <button class="btn btn-primary" id="copyTipBtn">📋 复制【提示】整段</button>
        <button class="btn btn-success" id="copyAddBtn">📋 复制【补充】整段</button>
    </div>

    <div class="preview-block" id="previewAll"></div>
</div>


</body>
</html>

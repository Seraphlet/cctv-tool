<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>央视舆情模块化生成器</title>
    <!-- 静态站点自动更新：入口资源绕过旧缓存，文件指纹用于检测后续部署。 -->
    <script>
    (function () {
        'use strict';

        // 版本查询参数不会清理用户的 localStorage、IndexedDB 或其他业务数据。
        const assetVersion = String(Date.now());
        const style = document.createElement('link');
        style.rel = 'stylesheet';
        style.href = 'style.css?v=' + assetVersion;
        document.head.appendChild(style);

        const core = document.createElement('script');
        core.src = 'core.js?v=' + assetVersion;
        core.defer = true;
        document.head.appendChild(core);

        // 检查所有本地静态资源：只修改某一个 modules/*.js 也能识别更新。
        // HEAD 主要使用 ETag / Last-Modified；缺失时回退读取并计算文件摘要。
        const files = [
            'index.html', 'style.css', 'core.js',
            'modules/builder-module.js', 'modules/calc-module.js',
            'modules/extract-module.js', 'modules/image-pad.js',
            'modules/news-module.js', 'modules/pingjie-module.js',
            'modules/quickboard-module.js', 'modules/reader-module.js',
            'modules/reminder-module.js', 'modules/scratchpad-module.js',
            'modules/yuqing-module.js'
        ];
        let baseline = null;
        let checking = false;
        let lastChecked = 0;

        async function signature(path) {
            const url = path + '?version_check=' + Date.now();
            const response = await fetch(url, { method: 'HEAD', cache: 'no-store' });
            if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
            const etag = response.headers.get('etag');
            const modified = response.headers.get('last-modified');
            const length = response.headers.get('content-length');
            if (etag) return etag;
            if (modified && length) return modified + '/' + length;

            // 没有可用的缓存验证头时，用内容摘要判定，避免每次都误报更新。
            const full = await fetch(url, { cache: 'no-store' });
            if (!full.ok) throw new Error(path + ': HTTP ' + full.status);
            const bytes = await full.arrayBuffer();
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return Array.from(new Uint8Array(digest)).map(v => v.toString(16).padStart(2, '0')).join('');
        }

        async function checkUpdate() {
            if (checking || document.hidden) return;
            if (baseline && Date.now() - lastChecked < 60 * 1000) return;
            checking = true;
            try {
                const versions = await Promise.all(files.map(signature));
                if (!baseline) {
                    baseline = versions;
                } else if (versions.some((value, i) => value !== baseline[i])) {
                    // 页面数据先由现有业务模块管理；刷新不删除持久存储。
                    // 换一个 URL 参数保证入口 HTML 本身也不会命中旧缓存。
                    const url = new URL(location.href);
                    url.searchParams.set('v', String(Date.now()));
                    location.replace(url.href);
                    return;
                }
                lastChecked = Date.now();
            } catch (error) {
                // 网络断开时保留当前页面，下一次恢复焦点再重试。
                console.debug('[更新检查] 暂时不可用', error);
            } finally {
                checking = false;
            }
        }

        window.addEventListener('load', checkUpdate);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkUpdate();
        });
        window.addEventListener('focus', checkUpdate);
        setInterval(checkUpdate, 5 * 60 * 1000);
    })();
    </script>
</head>
<body>
<div class="container">
    <div class="title">央视舆情模块化生成器</div>

    <div class="calc-panel" id="calcPanel">
        <div class="calc-card" id="sumModule"></div>
        <div class="calc-card" id="segmentModule"></div>
        <div class="calc-card" id="diffModule"></div>
    </div>

    <div class="tab-main" id="mainTabs">
        <span data-m="richang" class="active">日常</span>
        <span data-m="quantao">全套监测</span>
        <span data-m="pingjie">📝 内容拼接</span>
        <span data-m="reader">📖 文本阅读</span>
    </div>

    <div class="tab-sub" id="yuqingTab">
        <span class="active" data-s="yuqing">舆情</span>
        <span data-s="zhengmian">正面</span>
    </div>

    <div class="tool-bar" id="toolBar">
        <button class="btn btn-warning normal-tool" id="editBtn">🔧 开启编辑模式</button>
        <button class="btn btn-dark normal-tool" id="saveDefaultBtn">💾 设为默认配置</button>
        <button class="btn btn-danger normal-tool" id="resetBtn">🔄 恢复初始配置</button>
        <button class="btn btn-dark" id="clearAllBtn" style="background:#8c8c8c;">🧹 清空所有内容</button>
    </div>

    <div id="moduleContainer">
        <p style="text-align:center;padding:40px;color:#999;">正在加载...</p>
    </div>

    <div class="copy-btn-group" id="copyBtns">
        <button class="btn btn-primary" id="copyTipBtn">📋 复制【提示】整段</button>
        <button class="btn btn-success" id="copyAddBtn">📋 复制【补充】整段</button>
    </div>

    <div class="preview-block" id="previewAll"></div>
</div>


</body>
</html>
